# What this gate does and does not prove: see ADR-0016.
#
# Green means the code compiles, host tests and protocol fixtures pass, the web
# bundle builds, and the repository invariants hold. It does NOT mean the app
# records correctly. An emulator has no real camera, no MANUAL_SENSOR and no
# hardware HEVC encoder, so capture behaviour is verified by the PR author on
# the physical reference device -- a Pixel 10 (ADR-0017) -- and recorded in the
# pull request's hardware table.
#
# Every step below is a Gradle task, an npm script, or a script in tools/, so a
# contributor can reproduce any failure locally. Nothing here calls `android`,
# `sdkmanager` or `adb`: local setup and CI setup differ (ADR-0014) and only the
# commands are allowed to be shared.
#
# On a pull request the `android` and `web` jobs run only when their own
# directory changed (`tools/changed-scopes.sh`, ADR-0016). A push to main always
# runs the complete gate, so nothing merges to main unverified and the Gradle
# cache keeps being written. `guards` and `pr-title` are never filtered: the
# repository invariants cover documentation, and the ADR index breaks from a
# docs-only change more easily than from a code one.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which jobs are worth running. Cheap, and the same script a contributor can
  # run locally to predict what CI will do:  ./tools/changed-scopes.sh origin/main
  changes:
    name: Changed scopes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.scopes.outputs.android }}
      web: ${{ steps.scopes.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base has to be reachable for the diff to mean anything.
          fetch-depth: 0
      - id: scopes
        # No argument on a push: every scope comes back true and the full gate runs.
        run: ./tools/changed-scopes.sh "${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"

  guards:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ADR invariants (CameraX pin, Camera2Interop confinement)
        run: ./tools/check-adr-invariants.sh
      - name: ':domain commonMain is platform-free'
        run: ./tools/check-domain-platform-free.sh
      - name: ADR index is consistent
        run: ./tools/check-adr-index.sh

  pr-title:
    name: PR title is a Conventional Commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # A squash merge takes its subject from the PR title, so the title is the
      # thing that has to conform. See CONTRIBUTING.md.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            build
            ci
            refactor
            test
            perf
            chore
          scopes: |
            domain
            capture
            server
            app
            web
            adr
            prd
            ci
          requireScope: false

  android:
    name: Build and test (Android)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit and fixture tests
        run: ./gradlew test :domain:jvmTest
      - name: Android lint
        run: ./gradlew lint
      - name: Assemble debug
        run: ./gradlew assembleDebug

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-android
          path: |
            android/**/build/reports/tests/**
            android/**/build/reports/lint-results-*.html
          retention-days: 7

  web:
    name: Build and typecheck (web)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # pnpm must be installed before setup-node, or the pnpm cache resolution
      # in setup-node has no pnpm to ask for its store path.
      # package_json_file is explicit because `defaults.run.working-directory`
      # applies only to `run:` steps, not to action inputs: without it the
      # action looks for package.json at the repo root and finds no
      # `packageManager` field to read the version from.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # --frozen-lockfile is pnpm's `npm ci`: it fails rather than silently
      # updating pnpm-lock.yaml when package.json has drifted from it.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
