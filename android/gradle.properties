# Project-wide Gradle settings. See docs/adr/0014-build-toolchain.md.

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
# Configuration cache is the AGP 9 default and constrains all build logic in
# this repository: no Project access at execution time. See ADR-0014.
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Deliberately absent: android.builtInKotlin, android.newDsl,
# android.uniquePackageNames, android.enableAppCompileTimeRClass. All four
# already default to the value this project wants on AGP 9, and Google's
# upgrade guidance says to remove them rather than restate them.
