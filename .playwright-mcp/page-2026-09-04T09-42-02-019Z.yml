  - main [ref=f3e15]:
    - generic [ref=f3e18]:
      - generic [ref=f3e19]: Funciones
      - heading "El montaje, reconstruido alrededor de las palabras." [level=1] [ref=f3e20]
      - paragraph [ref=f3e21]:
        - text: En el vídeo hablado, la transcripción
        - emphasis [ref=f3e22]: es
        - text: ya la lista de decisiones de montaje. Scenaristo la trata así y mantiene una línea de tiempo real al alcance para los momentos que piden un fotograma, no una frase.
    - generic [ref=f3e24]:
      - generic [ref=f3e25]:
        - generic [ref=f3e26]: Montaje basado en texto
        - heading "La transcripción es el editor." [level=2] [ref=f3e27]
        - paragraph [ref=f3e28]: Cada palabra lleva su propia marca de tiempo, así que el documento y el material son dos vistas del mismo montaje. Selecciona una frase, pulsa suprimir y el material se cierra. Los cortes caen en los límites de palabra con un breve fundido encadenado, así que no suena ningún chasquido.
        - list [ref=f3e29]:
          - listitem [ref=f3e30]:
            - generic [ref=f3e33]: Haz clic en una palabra para llevar allí el punto de reproducción al instante.
          - listitem [ref=f3e34]:
            - generic [ref=f3e38]: Un solo historial de deshacer abarca texto y línea de tiempo a la vez.
          - listitem [ref=f3e39]:
            - generic [ref=f3e43]: Léelo como un artículo o cambia a una disposición de página tipo guion.
          - listitem [ref=f3e44]:
            - generic [ref=f3e49]: Busca en la transcripción para saltar directamente a cualquier frase.
          - listitem [ref=f3e50]:
            - generic [ref=f3e54]: Empieza a montar antes de que termine. La transcripción llega en segundo plano, así que una grabación larga se puede montar desde el primer minuto transcrito.
      - generic [ref=f3e56]:
        - 'button "Ver a tamaño completo: Una grabación de 92 minutos dispuesta como un artículo editable en el lector de transcripción, 9610 palabras con sincronía por palabra." [ref=f3e57]'
        - generic [ref=f3e58]: Lector editorial · 9610 palabras · sincronía por palabra
    - generic [ref=f3e60]:
      - generic [ref=f3e61]:
        - generic [ref=f3e62]: Híbrido por diseño
        - heading "Una línea de tiempo real para los momentos al fotograma." [level=2] [ref=f3e63]
        - paragraph [ref=f3e64]: "Casi todos los cortes ocurren en el texto. Pero cuando uno cae a mitad de una respiración, la línea de tiempo clásica está ahí mismo: ajusta un límite al fotograma, corta una zona sin habla, mueve un punto de corte. Y muestra el vídeo que estás haciendo, no la grabación que importaste: el material cortado sencillamente no se dibuja, así que cada corte se lee como una junta entre clips y la regla marca el tiempo de salida."
        - list [ref=f3e65]:
          - listitem [ref=f3e66]:
            - generic [ref=f3e70]: Pistas de vídeo, audio y texto, alineadas en el mismo punto de reproducción. Arrastra en cualquier punto de ellas para recorrerlas.
          - listitem [ref=f3e71]:
            - generic [ref=f3e75]: Forma de onda y zoom para ajustes precisos, al fotograma.
          - listitem [ref=f3e76]:
            - generic [ref=f3e80]: Un fundido encadenado en cualquier corte. Añádelo o quítalo en la junta misma, y la reproducción y la exportación rinden el mismo fundido.
      - generic [ref=f3e82]:
        - 'button "Ver a tamaño completo: La vista de línea de tiempo con las palabras tachadas reflejadas como cortes cerrados en las pistas de vídeo y audio, y la transcripción sincronizada en la barra lateral." [ref=f3e83]'
        - generic [ref=f3e84]: Vista de línea de tiempo · barra de transcripción sincronizada
    - generic [ref=f3e86]:
      - generic [ref=f3e87]:
        - generic [ref=f3e88]: El resto de la caja de herramientas
        - heading "Funciones tranquilas que hacen trabajo de verdad." [level=2] [ref=f3e89]
      - generic [ref=f3e90]:
        - generic [ref=f3e91]:
          - heading "Eliminación suave con tachado" [level=3] [ref=f3e95]
          - paragraph [ref=f3e96]: Prueba un corte antes de confirmarlo. El texto tachado sigue visible pero atenuado; la reproducción y la exportación lo saltan; un clic lo devuelve sin pérdidas.
          - generic [ref=f3e97]: No destructivo
        - generic [ref=f3e98]:
          - heading "Muletillas y silencios, limpiados" [level=3] [ref=f3e103]
          - paragraph [ref=f3e104]: "Cada \"eh\", \"o sea\" y pausa demasiado larga queda marcado, y el vocabulario de muletillas sigue el idioma de la grabación: una grabación en español recibe una lista española. Revísalas una a una o tacha el conjunto entero con un solo clic."
          - generic [ref=f3e105]: En bloque o una a una
        - generic [ref=f3e106]:
          - heading "Subtítulos de regalo" [level=3] [ref=f3e110]
          - paragraph [ref=f3e111]: Exporta SRT y VTT desde la transcripción corregida y ya cortada, con los bloques agrupados en la puntuación natural, o incrústalos en la imagen para los Shorts. Tus subtítulos coinciden exactamente con el montaje final, sin una segunda pasada.
          - generic [ref=f3e112]: SRT · VTT
        - generic [ref=f3e113]:
          - heading "Correction mode" [level=3] [ref=f3e117]
          - paragraph [ref=f3e118]: Corrige un nombre mal transcrito sin tocar un fotograma (Correction mode, modo corrección). Un modo aparte mantiene bien separadas las correcciones de texto y los cortes.
          - generic [ref=f3e119]: Solo texto
        - generic [ref=f3e120]:
          - heading "Etiquetas de varios hablantes" [level=3] [ref=f3e126]
          - paragraph [ref=f3e127]: Entrevistas y mesas redondas se dividen en turnos que renombras en la propia transcripción, con cada voz distinguida de forma coherente en todo el archivo. Dile cuántas voces hay, o déjalo decidir; probar otro número rehace solo la pasada de hablantes.
          - generic [ref=f3e128]: Diarización en local
        - generic [ref=f3e129]:
          - heading "Normalización de volumen" [level=3] [ref=f3e133]
          - paragraph [ref=f3e134]: Masteriza el audio a un objetivo (Podcast −16 LUFS, un valor propio, o el objetivo social de −14 LUFS aplicado automáticamente a las exportaciones de vídeo), dentro de ±0.5 LU, con techo de pico y el resultado medido informado de vuelta.
          - generic [ref=f3e135]: EBU R128 · LUFS
        - generic [ref=f3e136]:
          - heading "Capítulos" [level=3] [ref=f3e141]
          - paragraph [ref=f3e142]:
            - text: Fija capítulos sobre palabras de la transcripción. Exporta una lista
            - code [ref=f3e143]: 00:00
            - text: para pegar en YouTube y tramas ID3
            - code [ref=f3e144]: CHAP
            - text: que las aplicaciones de pódcast muestran de forma nativa. Los capítulos se mueven con tus cortes.
          - generic [ref=f3e145]: YouTube · ID3 CHAP
        - generic [ref=f3e146]:
          - heading "Pasa a tu programa de edición" [level=3] [ref=f3e150]
          - paragraph [ref=f3e151]: Exporta una línea de tiempo FCPXML 1.11 con cortes, fundidos encadenados y marcadores de capítulo intactos, para rematar en Final Cut Pro, Premiere o DaVinci Resolve. No se recodifica ningún material.
          - generic [ref=f3e152]: Exportación FCPXML
        - generic [ref=f3e153]:
          - heading "Export All, en una pasada" [level=3] [ref=f3e158]
          - paragraph [ref=f3e159]: Saca un MP4 a la resolución de origen, codificado según la especificación H.264 que recomiendan las plataformas, o MP3/WAV para pódcast, o agrupa vídeo, subtítulos y capítulos tras una sola ventana con un nombre común. La duración es el origen menos tus cortes.
          - generic [ref=f3e160]: MP4 · MP3 · WAV
        - generic [ref=f3e161]:
          - heading "Quédate con la mejor toma" [level=3] [ref=f3e165]
          - paragraph [ref=f3e166]: "Graba la misma frase hasta que salga bien: un análisis encuentra cada intento. Revisa cada grupo en la transcripción, escucha las tomas una junto a otra, elige la buena y acepta para tachar el resto. Propuestas, no cambios, hasta que tú lo digas."
          - generic [ref=f3e167]: Detección de tomas
        - generic [ref=f3e168]:
          - heading "Clips y exportación vertical" [level=3] [ref=f3e172]
          - paragraph [ref=f3e173]: "Selecciona un tramo, pulsa ⌘⇧K y expórtalo como MP4 9:16 o 1:1 con un SRT resincronizado: superposición de recorte, guías de zona segura y encuadre automático en local incluidos."
          - generic [ref=f3e174]: 9:16 · 1:1 · ⌘⇧K
        - generic [ref=f3e175]:
          - heading "Subtítulos incrustados" [level=3] [ref=f3e179]
          - paragraph [ref=f3e180]: Compón los subtítulos en los fotogramas para la reproducción automática sin sonido, con un estilo de legibilidad fija idéntico al SRT aparte, previsualizados exactamente como se van a publicar.
          - generic [ref=f3e181]: Subtítulos abiertos
        - generic [ref=f3e182]:
          - heading "Deliverable Modes" [level=3] [ref=f3e187]
          - paragraph [ref=f3e188]: "En la primera importación di qué estás haciendo (Deliverable Modes, formatos de entrega: Podcast, Long-form o Short-form) y los ajustes de exportación y la disposición adecuados quedan puestos de una vez. Siempre modificable, nunca impuesto de nuevo."
          - generic [ref=f3e189]: Podcast · Long-form · Short-form
