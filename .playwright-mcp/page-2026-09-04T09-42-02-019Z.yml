      - generic [ref=f3e201]:
        - generic [ref=f3e202]: Bajo el capó
        - heading "En local, y honestos al respecto." [level=2] [ref=f3e203]
        - paragraph [ref=f3e204]:
          - text: La transcripción se apoya en modelos de voz abiertos de primer nivel, descargados a demanda y fijados por suma de comprobación. En el instalador no viene nada incluido. Elige el rápido por defecto, o pasa a un modelo más pesado cuando haga falta precisión. Mira la
          - link "familia de modelos completa" [ref=f3e205] [cursor=pointer]:
            - /url: /es/models
          - text: .
      - generic [ref=f3e206]:
        - generic [ref=f3e207]:
          - heading "Importación" [level=3] [ref=f3e208]
          - paragraph [ref=f3e209]: MP4, MOV, MKV y WebM (VP9/Opus) para vídeo. MP3, WAV, AAC y M4A para audio. Arrastrar y soltar; el clip llega a la línea de tiempo antes incluso de que empiece la transcripción.
        - generic [ref=f3e210]:
          - heading "Modelos de transcripción" [level=3] [ref=f3e211]
          - paragraph [ref=f3e212]: No viene nada incluido. El modelo Parakeet por defecto y todas las alternativas se descargan a demanda con sumas de comprobación fijadas, así la aplicación sigue siendo pequeña y solo bajas lo que usas.
        - generic [ref=f3e213]:
          - heading "macOS" [level=3] [ref=f3e214]
          - paragraph [ref=f3e215]: macOS 14 Sonoma o posterior en Apple silicon. 8 GB de memoria mínimo, 16 GB recomendados. La codificación y la decodificación van por los motores multimedia del sistema, así que las exportaciones son rápidas sin una granja de renderizado. Los proyectos viven en una biblioteca con Recents y Save As, y la transcripción va en segundo plano con progreso en directo en archivos largos.
        - generic [ref=f3e216]:
          - heading "Windows" [level=3] [ref=f3e217]
          - paragraph [ref=f3e218]:
            - text: El mismo editor en Windows 10 x64, con instalador firmado y archivos de proyecto portables que también se abren en macOS. 8 GB de memoria mínimo, 16 GB recomendados; GPU dedicada recomendada, no obligatoria.
            - link "Descargar para Windows" [ref=f3e219] [cursor=pointer]:
              - /url: /es/download#windows
            - text: .
