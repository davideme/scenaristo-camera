        - paragraph [ref=f2e124]: "La transcripción se ejecuta por completo en tu propio hardware: modelos de voz que descargas una vez y se quedan contigo. Sin paso por la nube, sin cola de renderizado y sin ningún servicio que pueda caerse a mitad del montaje. Tras esa descarga única, desconecta el cable de red y todo sigue funcionando."
