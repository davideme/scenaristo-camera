          - paragraph [ref=f2e132]: Transcribe, monta y exporta todo lo que quieras en tu equipo. Sin minutos de contenido, sin créditos, sin horas mensuales. El único límite es tu hardware.
        - generic [ref=f2e133]:
          - heading "Funciona sin conexión" [level=3] [ref=f2e138]
          - paragraph [ref=f2e139]: No hace falta internet para importar, transcribir, montar ni exportar. Tu material se queda en el disco, nunca se sube, y todo el flujo funciona con la red apagada.
