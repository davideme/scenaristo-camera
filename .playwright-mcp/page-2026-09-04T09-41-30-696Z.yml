          - listitem [ref=f2e99]:
            - generic [ref=f2e103]: "Una línea de tiempo real está siempre a un toque. Cuando un corte cae a mitad de una respiración, ajústalo al fotograma: la transcripción sigue perfectamente sincronizada."
          - listitem [ref=f2e104]:
